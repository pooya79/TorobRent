services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8.10.0-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.30.7
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: sh -c "uv sync --locked && uv run --no-sync python manage.py migrate"
    working_dir: /app/backend
    environment: &backend-environment
      DJANGO_SETTINGS_MODULE: config.settings.local
      DJANGO_SECRET_KEY: local-development-only
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      CSRF_TRUSTED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_USE_TLS: "false"
      FRONTEND_ORIGIN: http://localhost:5173
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: uv run --no-sync uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload
    working_dir: /app/backend
    environment: *backend-environment
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
      - media-data:/app/backend/media
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: uv run --no-sync celery -A config worker --loglevel=INFO
    working_dir: /app/backend
    environment: *backend-environment
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
      - media-data:/app/backend/media
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    command: >-
      uv run --no-sync celery -A config beat --loglevel=INFO
      --schedule=/var/lib/celery/celerybeat-schedule
    working_dir: /app/backend
    environment: *backend-environment
    volumes:
      - ./backend:/app/backend
      - backend-venv:/app/backend/.venv
      - celerybeat-data:/var/lib/celery
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: development
    working_dir: /app/frontend
    command: sh -c "pnpm install --frozen-lockfile && pnpm dev"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    volumes:
      - ./frontend:/app/frontend
      - frontend-node-modules:/app/frontend/node_modules
    expose:
      - "5173"
    depends_on:
      backend:
        condition: service_started

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    environment:
      BACKEND_UPSTREAM: backend:8000
      FRONTEND_UPSTREAM: frontend:5173
    ports:
      - "5173:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres-data:
  backend-venv:
  media-data:
  celerybeat-data:
  frontend-node-modules:
