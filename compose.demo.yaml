name: torobrent-demo

x-backend-environment: &backend-environment
  DJANGO_SETTINGS_MODULE: config.settings.demo
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
  DATABASE_URL: ${DATABASE_URL}
  REDIS_URL: ${REDIS_URL}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
  FRONTEND_ORIGIN: ${FRONTEND_ORIGIN}
  SECURE_SSL_REDIRECT: "false"
  SECURE_HSTS_SECONDS: "0"
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
  EMAIL_HOST: mailpit
  EMAIL_PORT: "1025"
  EMAIL_USE_TLS: "false"
  DEFAULT_FROM_EMAIL: demo@torobrent.local

x-backend-build: &backend-build
  context: .
  dockerfile: backend/Dockerfile
  target: production

services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.30.7
    restart: unless-stopped
    ports:
      - "${DEMO_MAILPIT_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8025/api/v1/info"]
      interval: 3s
      timeout: 3s
      retries: 30

  migrate:
    build: *backend-build
    command: [".venv/bin/python", "manage.py", "migrate", "--noinput"]
    environment: *backend-environment
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"

  seed:
    build: *backend-build
    command: [".venv/bin/python", "manage.py", "seed_demo"]
    environment: *backend-environment
    volumes:
      - media-data:/app/backend/media
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  backend:
    build: *backend-build
    command:
      [
        ".venv/bin/uvicorn",
        "config.asgi:application",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--log-config",
        "config/uvicorn_logging.json",
      ]
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - media-data:/app/backend/media
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/system/live/', timeout=2)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

  worker:
    build: *backend-build
    command: [".venv/bin/celery", "-A", "config", "worker", "--loglevel=INFO"]
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - media-data:/app/backend/media
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          ".venv/bin/celery -A config inspect ping -d celery@$${HOSTNAME} --timeout 2 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  beat:
    build: *backend-build
    command:
      [
        ".venv/bin/celery",
        "-A",
        "config",
        "beat",
        "--loglevel=INFO",
        "--schedule=/var/lib/celery/celerybeat-schedule",
      ]
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - celerybeat-data:/var/lib/celery
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "grep -qa celery /proc/1/cmdline && .venv/bin/celery -A config inspect ping --timeout 2 | grep -q pong",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: production
      args:
        VITE_MAP_ADAPTER: fake
        VITE_MAILPIT_URL: http://localhost:${DEMO_MAILPIT_PORT:-8025}
    restart: unless-stopped
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/"]
      interval: 5s
      timeout: 3s
      retries: 30

  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:8000
      FRONTEND_UPSTREAM: frontend:3000
    ports:
      - "${DEMO_APP_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/api/v1/system/live/"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  media-data:
  celerybeat-data:
