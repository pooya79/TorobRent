          - string
          - 'null'
          format: uuid
        district:
          type:
          - string
          - 'null'
          format: uuid
        neighborhood:
          type:
          - string
          - 'null'
          format: uuid
        property_type:
          oneOf:
          - $ref: '#/components/schemas/PropertyTypeEnum'
          - $ref: '#/components/schemas/BlankEnum'
        area_sqm:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        room_count:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        deposit_rial:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        monthly_rent_rial:
          type:
          - integer
          - 'null'
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        description:
          type: string
        title:
          type: string
          maxLength: 200
    CandidateImage:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        original_url:
          type: string
        source_order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        is_primary:
          type: boolean
        excluded:
          type: boolean
        state:
