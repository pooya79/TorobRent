openapi: 3.1.0
info:
  title: TorobRent API
  version: 1.0.0
  description: TorobRent — a smart rental search platform that aggregates, normalizes,
    and ranks property listings from multiple sources.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      summary: Log in with an email and password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication failed
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Log out of the current session
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      summary: Request a password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      summary: Reset a password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      summary: Register a Submitter
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/session/:
    get:
      operationId: v1_auth_session_retrieve
      summary: Inspect the browser session
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      summary: Verify a Submitter email address
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/catalog/locations/:
    get:
      operationId: v1_catalog_locations_list
      summary: Autocomplete reviewed Tehran locations
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Persian city, municipal district, or neighborhood name
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationSuggestion'
          description: ''
  /api/v1/catalog/properties/:
    get:
      operationId: v1_catalog_properties_list
      summary: Search Properties with an Active Listing
      parameters:
      - in: query
        name: location
        schema:
          type: string
        description: Location UUID or tolerant Persian location text
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertySummaryList'
          description: ''
  /api/v1/catalog/properties/{property_id}/:
    get:
      operationId: v1_catalog_properties_retrieve
      summary: Get a publicly available Property
      parameters:
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No Property with an Active Listing was found
  /api/v1/system/live/:
    get:
      operationId: v1_system_live_retrieve
      summary: Check process liveness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/system/ready/:
    get:
      operationId: v1_system_ready_retrieve
      summary: Check dependency readiness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: A dependency is unavailable
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      summary: Get the current user
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication is required
components:
  schemas:
    CurrencyEnum:
      enum:
      - IRR
      type: string
      description: '* `IRR` - IRR'
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FeatureStateEnum:
      enum:
      - unknown
      - present
      - absent
      type: string
      description: |-
        * `unknown` - نامشخص
        * `present` - دارد
        * `absent` - ندارد
    Features:
      type: object
      properties:
        parking:
          $ref: '#/components/schemas/FeatureStateEnum'
        elevator:
          $ref: '#/components/schemas/FeatureStateEnum'
        storage:
          $ref: '#/components/schemas/FeatureStateEnum'
        balcony:
          $ref: '#/components/schemas/FeatureStateEnum'
        furnished:
          $ref: '#/components/schemas/FeatureStateEnum'
      required:
      - balcony
      - elevator
      - furnished
      - parking
      - storage
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    KindEnum:
      enum:
      - city
      - district
      - neighborhood
      type: string
      description: |-
        * `city` - city
        * `district` - district
        * `neighborhood` - neighborhood
    ListingPublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourcePublic'
        rental_terms:
          $ref: '#/components/schemas/RentalTermsPublic'
        description:
          type: string
        source_claims: {}
        external_url:
          oneOf:
          - type: string
            format: uri
          - type: string
            maxLength: 0
        is_negotiable:
          type: boolean
        is_convertible:
          type: boolean
        availability_confirmed_at:
          type: string
          format: date-time
        available_until:
          type: string
          format: date-time
      required:
      - availability_confirmed_at
      - available_until
      - description
      - external_url
      - id
      - is_convertible
      - is_negotiable
      - rental_terms
      - source
      - source_claims
    Location:
      type: object
      properties:
        city:
          type: string
        district:
          type: string
        district_number:
          type: integer
        neighborhood:
          type: string
      required:
      - city
      - district
      - district_number
      - neighborhood
    LocationSuggestion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/KindEnum'
        name:
          type: string
        label:
          type: string
      required:
      - id
      - kind
      - label
      - name
    Login:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    OutboundPolicyEnum:
      enum:
      - direct_contact
      - external_link
      - disabled
      type: string
      description: |-
        * `direct_contact` - تماس مستقیم
        * `external_link` - پیوند منبع
        * `disabled` - غیرفعال
    PaginatedPropertySummaryList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/properties/?page=2
        previous:
          type:
          - string
          - 'null'
          format: uri
          example: http://api.example.org/properties/?page=1
        results:
          type: array
          items:
            $ref: '#/components/schemas/PropertySummary'
    PasswordResetConfirm:
      type: object
      properties:
        token:
          type: string
        new_password:
          type: string
          writeOnly: true
      required:
      - new_password
      - token
    PasswordResetRequest:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type:
          - string
          - 'null'
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ProblemFieldError'
      required:
      - code
      - detail
      - request_id
      - status
      - title
      - type
    ProblemFieldError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    PropertyDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        canonical_slug:
          type: string
        location:
          $ref: '#/components/schemas/Location'
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        property_type_label:
          type: string
        area_sqm:
          type: integer
        room_count:
          type: integer
        construction_year:
          type:
          - integer
          - 'null'
        floor:
          type:
          - integer
          - 'null'
        total_floors:
          type:
          - integer
          - 'null'
        units_per_floor:
          type:
          - integer
          - 'null'
        heating:
          type: string
        cooling:
          type: string
        features:
          $ref: '#/components/schemas/Features'
        listings:
          type: array
          items:
            $ref: '#/components/schemas/ListingPublic'
      required:
      - area_sqm
      - canonical_slug
      - construction_year
      - cooling
      - features
      - floor
      - heating
      - id
      - listings
      - location
      - property_type
      - property_type_label
      - room_count
      - title
      - total_floors
      - units_per_floor
    PropertySummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        canonical_slug:
          type: string
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          readOnly: true
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        property_type_label:
          type: string
        area_sqm:
          type: integer
        room_count:
          type: integer
        construction_year:
          type:
          - integer
          - 'null'
        listing_count:
          type: integer
        rental_terms:
          allOf:
          - $ref: '#/components/schemas/RentalTermsPublic'
          readOnly: true
        availability_confirmed_at:
          type: string
          format: date-time
      required:
      - area_sqm
      - availability_confirmed_at
      - canonical_slug
      - construction_year
      - id
      - listing_count
      - location
      - property_type
      - property_type_label
      - rental_terms
      - room_count
      - title
    PropertyTypeEnum:
      enum:
      - apartment
      - house
      - villa
      type: string
      description: |-
        * `apartment` - آپارتمان
        * `house` - خانه
        * `villa` - ویلا
    Registration:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          writeOnly: true
      required:
      - email
      - password
    RentalTermsPublic:
      type: object
      properties:
        deposit_rial:
          type: integer
        monthly_rent_rial:
          type: integer
        currency:
          $ref: '#/components/schemas/CurrencyEnum'
        deposit_toman:
          type: integer
        monthly_rent_toman:
          type: integer
      required:
      - currency
      - deposit_rial
      - deposit_toman
      - monthly_rent_rial
      - monthly_rent_toman
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
      required:
      - authenticated
      - csrf_token
    SourcePublic:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        display_name:
          type: string
        outbound_policy:
          $ref: '#/components/schemas/OutboundPolicyEnum'
      required:
      - display_name
      - id
      - name
      - outbound_policy
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    Token:
      type: object
      properties:
        token:
          type: string
      required:
      - token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
        email_verified:
          type: boolean
          readOnly: true
      required:
      - email
      - email_verified
      - first_name
      - id
      - last_name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
