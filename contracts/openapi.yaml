  /api/v1/operator/support-requests/:
    get:
      operationId: v1_operator_support_requests_list
      summary: List and filter the Support Request queue
      parameters:
      - in: query
        name: age_days
        schema:
          type: integer
        description: Include requests created at least this many whole days ago.
      - in: query
        name: assignee
        schema:
          oneOf:
          - type: string
            enum:
            - unassigned
            - assigned
            - mine
            - other
          - type: string
            format: uuid
        description: 'Assignment facet: unassigned, assigned, mine, other, or an Operator
          UUID.'
      - in: query
        name: classification
        schema:
          type: string
          enum:
          - account_deletion
          - guidance
          - privacy
          - spam
          - unclassified
        description: Match the authoritative Support Classification.
      - in: query
        name: created_after
        schema:
          type: string
          format: date-time
        description: Include requests created at or after this UTC timestamp.
      - in: query
        name: created_before
        schema:
          type: string
          format: date-time
        description: Include requests created at or before this UTC timestamp.
      - in: query
        name: intake_kind
        schema:
          type: string
          enum:
          - account_deletion
          - general
          - public_contact_removal
        description: Match the requester's declared Intake Kind.
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - newest
          - oldest
        description: Order by request creation time; defaults to oldest first.
      - in: query
        name: page
        schema:
          type: integer
        description: One-based page number.
      - in: query
        name: page_size
        schema:
          type: integer
        description: Records per page; defaults to 50 and is capped at 100.
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - normal
          - urgent
        description: Match the current Support Request priority.
      - in: query
        name: search
        schema:
          type: string
        description: Case-insensitive search across requester name, email, and message.
      - in: query
        name: status
        schema:
          type: string
          enum:
          - escalated
          - in_progress
          - open
          - resolved
        description: Match the current operational state.
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSupportRequestQueueList'
          description: ''
