  /api/v1/catalog/locations/:
    get:
      operationId: v1_catalog_locations_list
      summary: Autocomplete reviewed Tehran locations
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Persian city, municipal district, or neighborhood name
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationSuggestion'
          description: ''
  /api/v1/catalog/media/{asset_id}/:
    get:
      operationId: v1_catalog_media_retrieve
      summary: Read a published first-party image
      parameters:
      - in: path
        name: asset_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/catalog/properties/:
    get:
      operationId: v1_catalog_properties_list
      summary: Search Properties with an Active Listing
      parameters:
      - in: query
        name: annual_return_rate
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        description: Renter-supplied annual effective opportunity-return assumption,
          as a percent.
      - in: query
        name: area_max
        schema:
          type: integer
          minimum: 1
      - in: query
        name: area_min
        schema:
          type: integer
          minimum: 1
      - in: query
        name: balcony
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: bedroom_count
        schema:
          oneOf:
          - type: integer
            minimum: 0
          - type: string
            enum:
            - 3_plus
      - in: query
        name: construction_year_max
        schema:
          type: integer
          maximum: 1500
          minimum: 1200
      - in: query
        name: construction_year_min
        schema:
          type: integer
          maximum: 1500
          minimum: 1200
      - in: query
        name: deposit_max_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: deposit_min_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: district
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: elevator
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: furnished
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: monthly_rent_max_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: monthly_rent_min_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: neighborhood
        schema:
          type: array
          items:
            type: string
            format: uuid
      - in: query
        name: ordering
        schema:
          enum:
          - preference_fit
          - newest
          - monthly_rent
          - deposit
          - area_desc
          - area_asc
          - equivalent_monthly_cost
          - freshness
          - area
          type: string
          minLength: 1
        description: |-
          Use the six canonical sort modes. `freshness` and `area` remain supported as deprecated aliases for `newest` and `area_asc`.

          * `preference_fit` - preference_fit
          * `newest` - newest
          * `monthly_rent` - monthly_rent
          * `deposit` - deposit
          * `area_desc` - area_desc
          * `area_asc` - area_asc
          * `equivalent_monthly_cost` - equivalent_monthly_cost
          * `freshness` - freshness
          * `area` - area
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: parking
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: preferences
        schema:
          type: string
        description: Bounded JSON object keyed by preference identifier; each value
          has priority (very_important, preferred, unimportant) and target. Rental
          Terms targets are in toman; freshness is days; district/neighborhood targets
          are up to 22 UUIDs. Invalid entries are ignored and reported.
      - in: query
        name: property_category
        schema:
          enum:
          - residential
          - commercial
          type: string
          minLength: 1
        description: |-
          * `residential` - مسکونی
          * `commercial` - تجاری
      - in: query
        name: property_type
        schema:
          type: array
          items:
            enum:
            - apartment
            - house
            - villa
            - office
            - shop
            - warehouse
            - workshop
            type: string
            description: |-
              * `apartment` - آپارتمان
              * `house` - خانه
              * `villa` - ویلا
              * `office` - دفتر اداری
              * `shop` - مغازه
              * `warehouse` - انبار
              * `workshop` - کارگاه
      - in: query
        name: room_count
        schema:
          oneOf:
          - type: integer
            minimum: 0
          - type: string
            enum:
            - 3_plus
        description: Deprecated alias for bedroom_count
      - in: query
        name: storage
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: viewport_east
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      - in: query
        name: viewport_north
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      - in: query
        name: viewport_south
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      - in: query
        name: viewport_west
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
      - in: query
        name: viewport_zoom
        schema:
          type: integer
          maximum: 22
          minimum: 0
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertySearchPage'
          description: ''
  /api/v1/catalog/properties/{property_id}/:
