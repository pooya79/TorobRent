openapi: 3.1.0
info:
  title: Application API
  version: 1.0.0
  description: Domain-neutral Django and React application API
paths:
  /api/v1/auth/session/:
    get:
      operationId: v1_auth_session_retrieve
      summary: Inspect the browser session
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/system/live/:
    get:
      operationId: v1_system_live_retrieve
      summary: Check process liveness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/system/ready/:
    get:
      operationId: v1_system_ready_retrieve
      summary: Check dependency readiness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: A dependency is unavailable
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      summary: Get the current user
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication is required
components:
  schemas:
    Health:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    Problem:
      type: object
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        request_id:
          type:
          - string
          - 'null'
          format: uuid
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/ProblemFieldError'
      required:
      - code
      - detail
      - request_id
      - status
      - title
      - type
    ProblemFieldError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
      required:
      - code
      - message
    Session:
      type: object
      properties:
        authenticated:
          type: boolean
        csrf_token:
          type: string
      required:
      - authenticated
      - csrf_token
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        first_name:
          type: string
          readOnly: true
        last_name:
          type: string
          readOnly: true
      required:
      - email
      - first_name
      - id
      - last_name
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
