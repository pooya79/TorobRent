openapi: 3.1.0
info:
  title: TorobRent API
  version: 1.0.0
  description: TorobRent — a smart rental search platform that aggregates, normalizes,
    and ranks property listings from multiple sources.
paths:
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      summary: Log in with an email and password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication failed
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      summary: Log out of the current session
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      summary: Request a password reset
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      summary: Reset a password
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirm'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      summary: Register a Submitter
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/auth/session/:
    get:
      operationId: v1_auth_session_retrieve
      summary: Inspect the browser session
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      summary: Verify a Submitter email address
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Token'
        required: true
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Detail'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request validation failed
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication or CSRF verification failed
        '415':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Only JSON request bodies are supported
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Request was throttled
  /api/v1/catalog/locations/:
    get:
      operationId: v1_catalog_locations_list
      summary: Autocomplete reviewed Tehran locations
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Persian city, municipal district, or neighborhood name
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LocationSuggestion'
          description: ''
  /api/v1/catalog/properties/:
    get:
      operationId: v1_catalog_properties_list
      summary: Search Properties with an Active Listing
      parameters:
      - in: query
        name: area_max
        schema:
          type: integer
          minimum: 1
      - in: query
        name: area_min
        schema:
          type: integer
          minimum: 1
      - in: query
        name: balcony
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: deposit_max_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: deposit_min_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: elevator
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: furnished
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: location
        schema:
          type: string
      - in: query
        name: monthly_rent_max_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: monthly_rent_min_toman
        schema:
          type: integer
          minimum: 0
      - in: query
        name: ordering
        schema:
          enum:
          - freshness
          - monthly_rent
          - deposit
          - area
          type: string
          minLength: 1
        description: |-
          * `freshness` - freshness
          * `monthly_rent` - monthly_rent
          * `deposit` - deposit
          * `area` - area
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: parking
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      - in: query
        name: property_type
        schema:
          enum:
          - apartment
          - house
          - villa
          type: string
          minLength: 1
        description: |-
          * `apartment` - آپارتمان
          * `house` - خانه
          * `villa` - ویلا
      - in: query
        name: room_count
        schema:
          type: integer
          minimum: 0
      - in: query
        name: storage
        schema:
          enum:
          - present
          - absent
          type: string
          minLength: 1
        description: |-
          * `present` - present
          * `absent` - absent
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPropertySummaryList'
          description: ''
  /api/v1/catalog/properties/{property_id}/:
    get:
      operationId: v1_catalog_properties_retrieve
      summary: Get a publicly available Property
      parameters:
      - in: path
        name: property_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PropertyDetail'
          description: ''
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No Property with an Active Listing was found
  /api/v1/operator/submissions/:
    get:
      operationId: v1_operator_submissions_list
      summary: List and filter the Operator review queue
      parameters:
      - in: query
        name: city
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: string
          format: uuid
      - in: query
        name: neighborhood
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - newest
          - oldest
      - in: query
        name: source
        schema:
          type: string
          format: uuid
      - in: query
        name: state
        schema:
          type: string
      - in: query
        name: updated_after
        schema:
          type: string
          format: date-time
      - in: query
        name: updated_before
        schema:
          type: string
          format: date-time
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/operator/submissions/{submission_id}/approve/:
    post:
      operationId: v1_operator_submissions_approve_create
      summary: Approve, group, and publish a pending Submission
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionApproval'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/operator/submissions/{submission_id}/reject/:
    post:
      operationId: v1_operator_submissions_reject_create
      summary: Terminally reject a pending Submission
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReason'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/operator/submissions/{submission_id}/request-changes/:
    post:
      operationId: v1_operator_submissions_request_changes_create
      summary: Request changes to a pending Submission
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewReason'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/submissions/:
    get:
      operationId: v1_submissions_list
      summary: List the current Submitter's Submissions
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
          description: ''
    post:
      operationId: v1_submissions_create
      summary: Create a Submission draft
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionCreate'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/submissions/{submission_id}/:
    get:
      operationId: v1_submissions_retrieve
      summary: Resume a Submission draft
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
    patch:
      operationId: v1_submissions_partial_update
      summary: Save a completed Submission step
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionStepUpdate'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/submissions/{submission_id}/images/:
    post:
      operationId: v1_submissions_images_create
      summary: Upload an image to a Submission draft
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionImageUpload'
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionImageUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionImage'
          description: ''
    patch:
      operationId: v1_submissions_images_partial_update
      summary: Reorder a Submission's images and choose its primary image
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionImageOrder'
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedSubmissionImageOrder'
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubmissionImage'
          description: ''
  /api/v1/submissions/{submission_id}/images/{image_id}/:
    delete:
      operationId: v1_submissions_images_destroy
      summary: Remove an image from a Submission
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/submissions/{submission_id}/images/{image_id}/content/{kind}/:
    get:
      operationId: v1_submissions_images_content_retrieve
      summary: Read a protected processed Submission image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: kind
        schema:
          type: string
        required: true
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            image/webp:
              schema:
                type: string
                format: binary
          description: ''
  /api/v1/submissions/{submission_id}/images/{image_id}/retry/:
    post:
      operationId: v1_submissions_images_retry_create
      summary: Replace and retry a failed Submission image
      parameters:
      - in: path
        name: image_id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SubmissionImageUpload'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionImage'
          description: ''
  /api/v1/submissions/{submission_id}/submit/:
    post:
      operationId: v1_submissions_submit_create
      summary: Submit a complete revision for Operator review
      parameters:
      - in: path
        name: submission_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Submission'
          description: ''
  /api/v1/system/live/:
    get:
      operationId: v1_system_live_retrieve
      summary: Check process liveness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
  /api/v1/system/ready/:
    get:
      operationId: v1_system_ready_retrieve
      summary: Check dependency readiness
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
          description: A dependency is unavailable
  /api/v1/users/me/:
    get:
      operationId: v1_users_me_retrieve
      summary: Get the current user
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Authentication is required
components:
  schemas:
    CompletedStepEnum:
      enum:
      - location
      - property_facts
      - rental_terms
      - features_description
      - images
      - contact
      - review
      type: string
      description: |-
        * `location` - location
        * `property_facts` - property_facts
        * `rental_terms` - rental_terms
        * `features_description` - features_description
        * `images` - images
        * `contact` - contact
        * `review` - review
    ContactInput:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        authorization_declared:
          type: boolean
        phone_publication_consent:
          type: boolean
      required:
      - authorization_declared
      - name
      - phone
      - phone_publication_consent
    ContactOutput:
      type: object
      properties:
        name:
          type: string
        phone:
          type: string
        authorization_declared:
          type: boolean
        phone_publication_consent:
          type: boolean
      required:
      - authorization_declared
      - name
      - phone
      - phone_publication_consent
    CurrencyEnum:
      enum:
      - IRR
      type: string
      description: '* `IRR` - IRR'
    CurrentStepEnum:
      enum:
      - location
      - property_facts
      - rental_terms
      - features_description
      - images
      - contact
      - review
      type: string
      description: |-
        * `location` - نشانی ملک
        * `property_facts` - مشخصات ملک
        * `rental_terms` - شرایط اجاره
        * `features_description` - امکانات و توضیحات
        * `images` - تصاویر
        * `contact` - اطلاعات تماس
        * `review` - بازبینی
    Detail:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    FeatureStateEnum:
      enum:
      - unknown
      - present
      - absent
      type: string
      description: |-
        * `unknown` - نامشخص
        * `present` - دارد
        * `absent` - ندارد
    Features:
      type: object
      properties:
        parking:
          $ref: '#/components/schemas/FeatureStateEnum'
        elevator:
          $ref: '#/components/schemas/FeatureStateEnum'
        storage:
          $ref: '#/components/schemas/FeatureStateEnum'
        balcony:
          $ref: '#/components/schemas/FeatureStateEnum'
        furnished:
          $ref: '#/components/schemas/FeatureStateEnum'
      required:
      - balcony
      - elevator
      - furnished
      - parking
      - storage
    FeaturesInput:
      type: object
      properties:
        parking:
          $ref: '#/components/schemas/FeatureStateEnum'
        elevator:
          $ref: '#/components/schemas/FeatureStateEnum'
        storage:
          $ref: '#/components/schemas/FeatureStateEnum'
        balcony:
          $ref: '#/components/schemas/FeatureStateEnum'
        furnished:
          $ref: '#/components/schemas/FeatureStateEnum'
      required:
      - balcony
      - elevator
      - furnished
