  /api/v1/messages/:
    get:
      operationId: v1_messages_list
      summary: List Message Center items
      parameters:
      - in: query
        name: kind
        schema:
          enum:
          - all
          - source_conversation
          - system_notification
          - listing_inquiry
          - support_request
          type: string
          default: all
          minLength: 1
        description: |-
          * `all` - all
          * `source_conversation` - source_conversation
          * `system_notification` - system_notification
          * `listing_inquiry` - listing_inquiry
          * `support_request` - support_request
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: unread
        schema:
          type: boolean
          default: false
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageSummaryList'
