  /api/v1/operator/submissions/:
    get:
      operationId: v1_operator_submissions_list
      summary: List and filter the Operator review queue
      parameters:
      - in: query
        name: age_days
        schema:
          type: integer
      - in: query
        name: assignee
        schema:
          type: string
      - in: query
        name: city
        schema:
          type: string
          format: uuid
      - in: query
        name: district
        schema:
          type: string
          format: uuid
      - in: query
        name: neighborhood
        schema:
          type: string
          format: uuid
      - in: query
        name: ordering
        schema:
          type: string
          enum:
          - newest
          - oldest
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: pending_after
        schema:
          type: string
          format: date-time
      - in: query
        name: pending_before
        schema:
          type: string
          format: date-time
      - in: query
        name: source
        schema:
          type: string
          format: uuid
      - in: query
