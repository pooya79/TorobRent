components:
  schemas:
    AccountBlock:
      type: object
      properties:
        blocked:
          type: boolean
      required:
      - blocked
    ActiveFavoriteSummary:
      type: object
      properties:
        preference_assessment:
          $ref: '#/components/schemas/PreferenceAssessment'
        id:
          type: string
          format: uuid
        title:
          type: string
        canonical_slug:
          type: string
        location:
          allOf:
          - $ref: '#/components/schemas/Location'
          readOnly: true
        approximate_location:
          oneOf:
          - $ref: '#/components/schemas/ApproximateLocation'
          - type: 'null'
          readOnly: true
        property_category:
          $ref: '#/components/schemas/PropertyCategoryEnum'
        property_category_label:
          type: string
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        property_type_label:
          type: string
        area_sqm:
          type: integer
        room_count:
          type: integer
        construction_year:
          type:
          - integer
          - 'null'
        primary_image:
          oneOf:
          - $ref: '#/components/schemas/PropertyImageSummary'
          - type: 'null'
          readOnly: true
        listing_count:
          type: integer
        is_favorite:
          type: boolean
        rental_terms:
          allOf:
          - $ref: '#/components/schemas/RentalTermsPublic'
          readOnly: true
        rental_terms_comparison:
          oneOf:
          - $ref: '#/components/schemas/RentalTermsComparison'
          - type: 'null'
          readOnly: true
        availability_confirmed_at:
          type: string
          format: date-time
        saved_at:
          type: string
          format: date-time
      required:
      - approximate_location
      - area_sqm
      - availability_confirmed_at
      - canonical_slug
      - construction_year
      - id
      - listing_count
      - location
      - primary_image
      - property_category
      - property_category_label
      - property_type
      - property_type_label
      - rental_terms
      - rental_terms_comparison
      - saved_at
      - title
    ApproximateLocation:
      type: object
      properties:
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
        precision:
          $ref: '#/components/schemas/PrecisionEnum'
        radius_meters:
          type: integer
          minimum: 1
      required:
      - latitude
      - longitude
      - precision
      - radius_meters
    AssignmentProfileVersion:
      type: object
      properties:
        id:
          type: string
          format: uuid
        number:
          type: integer
      required:
      - id
      - number
    AssignmentSource:
      type: object
      properties:
        processing_paused:
          type: boolean
          readOnly: true
        processing_revision:
          type: integer
          readOnly: true
        crawl_interval_hours:
          type: integer
          readOnly: true
        crawl_schedule_revision:
          type: integer
          readOnly: true
        next_crawl_at:
          type:
          - string
          - 'null'
          format: date-time
          readOnly: true
        crawl_schedule_error:
          type: string
          readOnly: true
        id:
          type: string
          format: uuid
        display_name:
          type: string
        domain:
          type: string
      required:
      - crawl_interval_hours
      - crawl_schedule_error
      - crawl_schedule_revision
      - display_name
      - domain
      - id
      - next_crawl_at
      - processing_paused
      - processing_revision
    AttentionStatusEnum:
      enum:
      - needs_attention
      - recent_change
      - stable
      - not_measured
      type: string
      description: |-
        * `needs_attention` - needs_attention
        * `recent_change` - recent_change
        * `stable` - stable
        * `not_measured` - not_measured
    AuditedFormatting:
      type: object
      properties:
        description:
          type: string
    AuditedNormalizedProperty:
      type: object
      properties:
        city_id:
          type: string
          format: uuid
        district_id:
          type: string
          format: uuid
        neighborhood_id:
          type: string
          format: uuid
        property_type:
          $ref: '#/components/schemas/PropertyTypeEnum'
        area_sqm:
          type: integer
        room_count:
          type: integer
        construction_year:
          type:
          - integer
          - 'null'
        floor:
          type:
          - integer
          - 'null'
        total_floors:
          type:
          - integer
          - 'null'
        units_per_floor:
          type:
          - integer
          - 'null'
        parking:
          $ref: '#/components/schemas/FeatureStateEnum'
        elevator:
          $ref: '#/components/schemas/FeatureStateEnum'
        storage:
          $ref: '#/components/schemas/FeatureStateEnum'
        balcony:
          $ref: '#/components/schemas/FeatureStateEnum'
        furnished:
          $ref: '#/components/schemas/FeatureStateEnum'
        operator_location_notes:
          type: string
    AuditedSourceMetadata:
      type: object
      properties:
        source_reference:
          type: string
        source_claims: {}
        provenance_note:
          type: string
    AuthorKindEnum:
      enum:
      - requester
      - operator
      type: string
      description: |-
        * `requester` - Requester
        * `operator` - Operator
    AvailabilityOutput:
      type: object
      properties:
        state:
          type: string
        confirmed_at:
          type:
          - string
          - 'null'
          format: date-time
        available_until:
          type:
          - string
          - 'null'
          format: date-time
        expiring_soon:
          type: boolean
      required:
      - available_until
      - confirmed_at
      - expiring_soon
      - state
    Band182Enum:
      enum:
      - likely
      - possible
      - below_threshold
      type: string
      description: |-
        * `likely` - likely
        * `possible` - possible
        * `below_threshold` - below_threshold
    BlankEnum:
      enum:
      - ''
    CandidateCorrection:
      type: object
      properties:
        reviewed_revision:
          type: integer
          minimum: 1
        reason:
          type: string
          maxLength: 2000
        values:
          $ref: '#/components/schemas/CandidateCorrectionValues'
        media:
          type: array
          items:
            $ref: '#/components/schemas/CandidateImageChoice'
      required:
      - reason
      - reviewed_revision
      - values
    CandidateCorrectionValues:
      type: object
