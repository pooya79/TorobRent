      operationId: v1_catalog_favorites_retrieve
      summary: List active and temporarily unavailable Favorites
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteCollection'
          description: ''
  /api/v1/catalog/listings/{listing_id}/continuation/:
    post:
      operationId: v1_catalog_listings_continuation_create
      summary: Resolve an Active Listing's external continuation
      parameters:
      - in: header
        name: X-TorobRent-Event-Session
        schema:
          type: string
          format: uuid
        description: Ephemeral per-tab token used only for short-lived deduplication
          and rate control
        required: true
      - in: path
        name: listing_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalContinuation'
          description: ''
  /api/v1/catalog/listings/{listing_id}/phone-reveal/:
    post:
      operationId: v1_catalog_listings_phone_reveal_create
      summary: Reveal the approved phone for an Active direct Listing
      parameters:
      - in: header
        name: X-TorobRent-Event-Session
        schema:
          type: string
          format: uuid
        description: Ephemeral per-tab token used only for short-lived deduplication
          and rate control
        required: true
