services:
  demo-sources:
    build:
      context: ..
      dockerfile: demo_sources/Dockerfile
      args:
        DEMO_BASE_DOMAIN: ${DEMO_BASE_DOMAIN:?Set DEMO_BASE_DOMAIN}
    environment:
      DEMO_BASE_DOMAIN: ${DEMO_BASE_DOMAIN:?Set DEMO_BASE_DOMAIN}
    ports:
      - "${DEMO_HTTP_PORT:-80}:80"
    restart: unless-stopped
